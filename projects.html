<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Projects — Alfie Bishop</title>
<meta name="description" content="Selected motion design projects by Alfie Bishop — TV ads, explainer videos, and 2D/3D motion graphics." />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css" />
</head>
<body>

<header class="site-header">
  <div class="container">
    <a href="index.html" class="logo-mark">Alfie Bishop<span>.</span></a>
    <nav class="main-nav">
      <a href="index.html">Home</a>
      <a href="projects.html" class="is-active">Projects</a>
      <a href="about.html">About</a>
      <a href="index.html#contact" class="nav-cta">Get in touch</a>
    </nav>
    <button class="nav-toggle" aria-label="Toggle menu"><span></span><span></span><span></span></button>
  </div>
</header>

<main>
  <section class="page-hero">
    <div class="container">
      <span class="eyebrow">Selected Work</span>
      <h1>Projects</h1>
      <p class="lead">A collection of TV ads, explainer films, and 2D/3D motion work. Filter by category below.</p>
    </div>
  </section>

  <section class="section" style="padding-top:0;">
    <div class="container">
      <div class="filter-bar" id="filter-bar">
        <button class="filter-btn is-active" data-filter="all">All Work</button>
      </div>

      <div class="project-grid" id="project-grid"><p class="cms-status">Loading projects…</p></div>
    </div>
  </section>
</main>

<footer class="site-footer">
  <div class="container">
    <small>© <span id="year"></span> Alfie Bishop. All rights reserved.</small>
    <div class="footer-links">
      <a href="projects.html">Projects</a>
      <a href="about.html">About</a>
      <a href="index.html#contact">Contact</a>
    </div>
  </div>
</footer>

<script src="assets/js/cms.js"></script>
<script src="assets/js/main.js"></script>
<script>
  document.getElementById("year").textContent = new Date().getFullYear();

  (async () => {
    await window.CMS_READY;

    const grid = document.getElementById("project-grid");
    const filterBar = document.getElementById("filter-bar");

    if (!PROJECTS.length) {
      grid.innerHTML = `<p class="cms-status">Couldn't load projects from the CMS right now — try refreshing.</p>`;
      return;
    }

    grid.innerHTML = PROJECTS.map(projectCardHTML).join("");

    // Filter buttons are built live from whatever categories exist in the
    // CMS right now, in the order they first appear.
    const seen = new Set();
    PROJECTS.forEach((p) => seen.add(p.categories[0]));
    const filterButtons = Array.from(seen)
      .map((cat) => `<button class="filter-btn" data-filter="${cat}">${CATEGORY_LABELS[cat] || cat}</button>`)
      .join("");
    filterBar.insertAdjacentHTML("beforeend", filterButtons);

    filterBar.addEventListener("click", (e) => {
      const btn = e.target.closest(".filter-btn");
      if (!btn) return;
      filterBar.querySelectorAll(".filter-btn").forEach((b) => b.classList.remove("is-active"));
      btn.classList.add("is-active");
      const filter = btn.dataset.filter;
      grid.querySelectorAll(".project-card").forEach((card) => {
        const cats = card.dataset.categories.split(" ");
        const show = filter === "all" || cats.includes(filter);
        card.classList.toggle("is-hidden", !show);
      });
    });

    initScrollReveal();
  })();
</script>
</body>
</html>
